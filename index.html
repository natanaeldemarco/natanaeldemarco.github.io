<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Natanael · Data Analyst & Automation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080c10;
      --bg2: #0d1117;
      --surface: #131820;
      --border: #1e2730;
      --accent: #00e5a0;
      --accent2: #0099ff;
      --accent-dim: rgba(0, 229, 160, 0.12);
      --text: #e8edf2;
      --muted: #6b7a8d;
      --font-head: 'Syne', sans-serif;
      --font-body: 'Space Grotesk', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.7;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 4rem;
      border-bottom: 1px solid var(--border);
      background: rgba(8, 12, 16, 0.85);
      backdrop-filter: blur(12px);
    }

    .nav-logo {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .nav-logo span { color: var(--accent); }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      font-family: var(--font-mono);
            color: var(--muted);
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--accent); }

    /* HERO */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8rem 4rem 4rem;
      overflow: hidden;
    }

    .hero-grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,160,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,160,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 40%, transparent 100%);
    }

    .hero-glow {
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(0,229,160,0.08) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .hero-tag {
      font-family: var(--font-mono);
            font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      animation: fadeUp 0.8s ease both;
    }

    .hero-tag::before {
      content: '';
      display: block;
      width: 32px; height: 1px;
      background: var(--accent);
    }

    .hero h1 {
      font-family: var(--font-head);
      font-size: clamp(3rem, 7vw, 6rem);
      font-weight: 800;
      line-height: 1.0;
      letter-spacing: -0.04em;
      max-width: 800px;
      animation: fadeUp 0.8s 0.1s ease both;
    }

    .hero h1 em {
      font-style: normal;
      color: var(--accent);
    }

    .hero-sub {
      margin-top: 1.8rem;
      color: var(--muted);
      max-width: 480px;
      font-size: 0.88rem;
      line-height: 1.8;
      animation: fadeUp 0.8s 0.2s ease both;
    }

    .hero-cta {
      margin-top: 3rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      animation: fadeUp 0.8s 0.3s ease both;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.8rem;
      border-radius: 4px;
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 0.85rem;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
      font-weight: 500;
    }

    .btn-primary:hover {
      background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,229,160,0.25);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    /* STATS BAR */
    .stats-bar {
      margin-top: 5rem;
      display: flex;
      gap: 3rem;
      flex-wrap: wrap;
      border-top: 1px solid var(--border);
      padding-top: 2rem;
      animation: fadeUp 0.8s 0.4s ease both;
    }

    .stat { display: flex; flex-direction: column; gap: 0.3rem; }

    .stat-num {
      font-family: var(--font-head);
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
    }

    .stat-num span { color: var(--accent); }

    .stat-label {
      font-family: var(--font-mono);
            font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* SECTION BASE */
    section {
      padding: 6rem 4rem;
      position: relative;
    }

    .section-tag {
      font-family: var(--font-mono);
            font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .section-tag::before {
      content: '';
      display: block;
      width: 20px; height: 1px;
      background: var(--accent);
    }

    .section-title {
      font-family: var(--font-head);
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 1rem;
      line-height: 1.1;
    }

    .section-sub {
      color: var(--muted);
      max-width: 500px;
      font-size: 0.85rem;
      margin-bottom: 3.5rem;
    }

    /* SERVICES */
    #servicios { background: var(--bg2); }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .service-card {
      background: var(--surface);
      padding: 2.5rem;
      position: relative;
      overflow: hidden;
      transition: background 0.3s;
    }

    .service-card:hover { background: #161e28; }

    .service-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s;
    }

    .service-card:hover::after { transform: scaleX(1); }

    .service-icon {
      width: 40px; height: 40px;
      border-radius: 6px;
      background: var(--accent-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
    }

    .service-name {
      font-family: var(--font-head);
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
    }

    .service-desc {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 1.5rem;
      line-height: 1.8;
    }

    .service-price {
      font-family: var(--font-head);
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent);
    }

    .service-price span {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }

    .service-features {
      margin-top: 1.2rem;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .service-features li {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      gap: 0.6rem;
    }

    .service-features li::before {
      content: '→';
      color: var(--accent);
      flex-shrink: 0;
    }

    /* STACK */
    #stack { background: var(--bg); }

    .skills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .skill-pill {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: 2px;
      font-size: 0.78rem;
      color: var(--muted);
      transition: all 0.2s;
      background: var(--surface);
    }

    .skill-pill:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .skill-pill .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.6;
    }

    /* PROYECTOS */
    #proyectos { background: var(--bg2); }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .project-card {
      background: var(--surface);
      padding: 2rem 2.5rem;
      position: relative;
      overflow: hidden;
      transition: background 0.3s;
    }

    .project-card:hover { background: #161e28; }

    .project-label {
      font-family: var(--font-mono);
            font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.8rem;
    }

    .project-title {
      font-family: var(--font-head);
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.7rem;
    }

    .project-desc {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.8;
      margin-bottom: 1.5rem;
    }

    .project-tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .project-tag {
      font-family: var(--font-mono);
            font-size: 0.68rem;
      padding: 0.25rem 0.6rem;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 2px;
    }

    .chart-deco {
      position: absolute;
      right: 1.5rem;
      bottom: 1.5rem;
      display: flex;
      gap: 4px;
      align-items: flex-end;
      opacity: 0.15;
    }

    .chart-deco div {
      width: 8px;
      background: var(--accent);
      border-radius: 1px;
    }

    a.project-card {
      color: inherit;
      text-decoration: none;
      display: block;
      cursor: pointer;
    }

    .project-card--featured {
      background: #10201b;
      border-left: 2px solid var(--accent);
    }

    .project-card--featured:hover { background: #142a23; }

    .project-live-badge {
      font-family: var(--font-mono);
            display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.8rem;
    }

    .project-live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(0,229,160,0.6);
      animation: pulseDot 1.8s infinite;
    }

    @keyframes pulseDot {
      0%   { box-shadow: 0 0 0 0 rgba(0,229,160,0.5); }
      70%  { box-shadow: 0 0 0 8px rgba(0,229,160,0); }
      100% { box-shadow: 0 0 0 0 rgba(0,229,160,0); }
    }

    .project-arrow {
      margin-left: 0.4rem;
      display: inline-block;
      transition: transform 0.2s;
    }

    .project-card--featured:hover .project-arrow {
      transform: translate(2px, -2px);
    }

    /* PROCESO */
    #proceso { background: var(--bg); }

    .process-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      max-width: 700px;
      border: 1px solid var(--border);
    }

    .process-item {
      display: flex;
      gap: 2rem;
      padding: 1.8rem 2rem;
      border-bottom: 1px solid var(--border);
      transition: background 0.2s;
    }

    .process-item:last-child { border-bottom: none; }
    .process-item:hover { background: var(--surface); }

    .process-num {
      font-family: var(--font-head);
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--border);
      line-height: 1;
      min-width: 50px;
      transition: color 0.2s;
    }

    .process-item:hover .process-num { color: var(--accent); }

    .process-title {
      font-family: var(--font-head);
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .process-desc {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.8;
    }

    /* CONTACTO */
    #contacto {
      background: var(--bg2);
      text-align: center;
      padding: 7rem 4rem;
    }

    .contact-box {
      max-width: 600px;
      margin: 0 auto;
    }

    .contact-email {
      display: inline-block;
      margin-top: 2rem;
      font-family: var(--font-head);
      font-size: clamp(1.3rem, 3vw, 2rem);
      font-weight: 800;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s;
    }

    .contact-email:hover { border-color: var(--accent); }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 2.5rem;
    }

    .social-link {
      font-family: var(--font-mono);
            color: var(--muted);
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .social-link:hover { color: var(--accent); }

    /* FOOTER */
    footer {
      font-family: var(--font-mono);
      padding: 1.5rem 4rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      color: var(--muted);
    }

    /* TERMINAL BADGE */
    .terminal-badge {
      font-family: var(--font-mono);
            display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.4rem 0.9rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .terminal-badge .prompt { color: var(--accent); }

    .blink {
      display: inline-block;
      width: 2px; height: 1em;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: none;
    }

    /* ═══════════════════════════════════════
       DASHBOARD SHOWCASE SECTION
    ═══════════════════════════════════════ */
    #dashboards {
      background: var(--bg);
      padding: 6rem 4rem;
    }

    /* Tab nav */
    .dash-tabs {
      display: flex;
      gap: 0;
      border: 1px solid var(--border);
      border-bottom: none;
      width: fit-content;
      margin-bottom: 0;
    }

    .dash-tab {
      padding: 0.7rem 1.6rem;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      border-right: 1px solid var(--border);
      background: var(--bg2);
      transition: all 0.2s;
      user-select: none;
    }

    .dash-tab:last-child { border-right: none; }

    .dash-tab.active {
      color: var(--accent);
      background: var(--surface);
      border-bottom: 2px solid var(--accent);
      margin-bottom: -1px;
    }

    .dash-tab:hover:not(.active) {
      color: var(--text);
      background: var(--surface);
    }

    /* Dashboard window */
    .dash-window {
      border: 1px solid var(--border);
      background: #0b1018;
      border-radius: 0 4px 4px 4px;
      overflow: hidden;
    }

    /* Window title bar */
    .dash-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 1.2rem;
      background: #090d12;
      border-bottom: 1px solid var(--border);
    }

    .dash-titlebar-left {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .dash-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
    }

    .dash-dot.red   { background: #ff5f57; }
    .dash-dot.yellow{ background: #febc2e; }
    .dash-dot.green { background: #28c840; }

    .dash-title-text {
      font-family: var(--font-mono);
            font-size: 0.7rem;
      color: var(--muted);
      margin-left: 0.5rem;
      letter-spacing: 0.05em;
    }

    .dash-titlebar-right {
      font-family: var(--font-mono);
            font-size: 0.65rem;
      color: #2a3a4a;
      letter-spacing: 0.05em;
    }

    /* Dashboard panels */
    .dash-panel {
      display: none;
      padding: 1.5rem;
      gap: 1rem;
      flex-direction: column;
    }

    .dash-panel.active { display: flex; }

    /* KPI row */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1rem 1.2rem;
      position: relative;
      overflow: hidden;
    }

    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
    }

    .kpi-card.green-accent::before { background: var(--accent); }
    .kpi-card.blue-accent::before  { background: var(--accent2); }
    .kpi-card.orange-accent::before{ background: #ff7b35; }
    .kpi-card.purple-accent::before{ background: #a78bfa; }

    .kpi-label {
      font-family: var(--font-mono);
            font-size: 0.63rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .kpi-value {
      font-family: var(--font-head);
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
      line-height: 1;
    }

    .kpi-value.green  { color: var(--accent); }
    .kpi-value.blue   { color: var(--accent2); }
    .kpi-value.orange { color: #ff7b35; }
    .kpi-value.purple { color: #a78bfa; }

    .kpi-delta {
      font-size: 0.65rem;
      margin-top: 0.4rem;
      color: var(--muted);
    }

    .kpi-delta.up   { color: var(--accent); }
    .kpi-delta.down { color: #ff5f57; }

    /* Chart row */
    .chart-row {
      display: grid;
      gap: 1rem;
    }

    .chart-row.two-col { grid-template-columns: 1fr 1fr; }
    .chart-row.main-side { gr
