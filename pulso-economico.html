/* ============================================================

const withMovingAvg = (() => {
  const out = monthlyData.map((d) => ({ ...d }));
  for (let i = 0; i < out.length; i++) {
    const win = out.slice(Math.max(0, i - 2), i + 1).map((d) => d.ipc).filter((v) => v != null);
    out[i].ipcMA = win.length === 3 ? +(win.reduce((a, b) => a + b, 0) / win.length).toFixed(2) : null;
  }
  return out;
})();

const rubrosJun26 = [
  { rubro: "Recreación y cultura", valor: 4.2 },
  { rubro: "Transporte", valor: 2.4 },
  { rubro: "Vivienda, agua y gas", valor: 2.1 },
  { rubro: "Alimentos y bebidas", valor: 1.8 },
  { rubro: "Salud", valor: 1.6 },
  { rubro: "Educación", valor: 1.3 },
  { rubro: "Indumentaria", valor: 1.1 },
  { rubro: "Comunicación", valor: 0.9 },
].sort((a, b) => b.valor - a.valor);

const brecha = (((latest.blue - latest.oficial) / latest.oficial) * 100).toFixed(1);

/* ============================================================
   HOOKS
   ============================================================ */
function usePrefersReducedMotion() {
  const [reduced, setReduced] = useState(false);
  useEffect(() => {
    if (typeof window === "undefined" || !window.matchMedia) return;
    const mq = window.matchMedia("(prefers-reduced-motion: reduce)");
    setReduced(mq.matches);
  }, []);
  return reduced;
}

function useCountUp(target, { decimals = 0, duration = 1100, prefix = "", suffix = "" } = {}) {
  const [display, setDisplay] = useState(0);
  const reduced = usePrefersReducedMotion();
  const raf = useRef(null);

  useEffect(() => {
    if (target == null) return;
    if (reduced) {
      setDisplay(target);
      return;
    }
    const start = performance.now();
    const ease = (t) => 1 - Math.pow(1 - t, 3);
    const tick = (now) => {
      const p = Math.min(1, (now - start) / duration);
      setDisplay(target * ease(p));
      if (p < 1) raf.current = requestAnimationFrame(tick);
    };
    raf.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf.current);
  }, [target, duration, reduced]);

  const formatted = display.toLocaleString("es-AR", {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals,
  });
  return `${prefix}${formatted}${suffix}`;
}

/* ============================================================
   SMALL COMPONENTS
   ============================================================ */
function Sparkline({ data, dataKey, color }) {
  return (
    <div style={{ width: "100%", height: 40 }}>
      <ResponsiveContainer>
        <LineChart data={data} margin={{ top: 4, right: 0, bottom: 0, left: 0 }}>
          <Line type="monotone" dataKey={dataKey} stroke={color} strokeWidth={2} dot={false}
                isAnimationActive={true} animationDuration={1000} connectNulls />
        </LineChart>
      </ResponsiveContainer>
    </div>
  );
}

function DeltaTag({ value, unit = "", invertGood = false, decimals = 1 }) {
  const isUp = value > 0;
  const isFlat = Math.abs(value) < 0.0001;
  const good = isFlat ? null : invertGood ? !isUp : isUp;
  const color = isFlat ? C.textMuted : good ? C.green : C.coral;
  const arrow = isFlat ? "→" : isUp ? "↑" : "↓";
  return (
    <span className="font-mono" style={{ color, fontSize: 13, fontWeight: 600, display: "inline-flex", alignItems: "center", gap: 4 }}>
      {arrow} {Math.abs(value).toFixed(decimals)}{unit}
    </span>
  );
}

function KpiCard({ label, value, sub, sparkData, sparkKey, sparkColor, delta, deltaUnit, invertGood, decimals }) {
  return (
    <div className="kpi-card rise-in" style={{
      background: C.bgPanel, border: `1px solid ${C.hairline}`, borderRadius: 18,
      padding: "20px 22px", display: "flex", flexDirection: "column", gap: 10, minWidth: 0,
    }}>
      <div className="font-ui" style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: C.textMuted }}>{label}</div>
      <div className="font-mono" style={{ fontSize: 30, fontWeight: 600, color: C.text, lineHeight: 1 }}>{value}</div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
        <DeltaTag value={delta} unit={deltaUnit} invertGood={invertGood} decimals={decimals} />
        <div style={{ width: 72 }}><Sparkline data={sparkData} dataKey={sparkKey} color={sparkColor} /></div>
      </div>
      <div className="font-ui" style={{ fontSize: 12, color: C.textFaint }}>{sub}</div>
    </div>
  );
}

function TickerTape() {
  const items = [
    `IPC MENSUAL (JUN-26) ${lastIpc.ipc.toFixed(2)}%`,
    `IPC INTERANUAL 33,55%`,
    `DÓLAR OFICIAL $${latest.oficial.toLocaleString("es-AR")}`,
    `DÓLAR BLUE $${latest.blue.toLocaleString("es-AR")}`,
    `BRECHA CAMBIARIA ${brecha}%`,
    `RIESGO PAÍS ${latest.riesgo} PB`,
    `RESERVAS BCRA U$S ${latest.reservas.toLocaleString("es-AR")} M`,
    `SUPERÁVIT COMERCIAL 1ER SEM. U$S 14.000 M`,
  ];
  const doubled = [...items, ...items];
  return (
    <div className="ticker-wrap" style={{ background: C.bgPanelAlt, borderBottom: `1px solid ${C.hairline}`, overflow: "hidden", padding: "9px 0" }}>
      <div className="ticker-track" style={{ display: "flex", whiteSpace: "nowrap" }}>
        {doubled.map((it, i) => (
          <span key={i} className="font-mono" style={{ fontSize: 12.5, color: C.textMuted, padding: "0 28px", letterSpacing: "0.02em" }}>
            <span style={{ color: C.gold, marginRight: 10 }}>●</span>{it}
          </span>
        ))}
      </div>
    </div>
  );
}

function ChartPanel({ title, source, children, height = 280 }) {
  return (
    <div className="rise-in" style={{ background: C.bgPanel, border: `1px solid ${C.hairline}`, borderRadius: 18, padding: "22px 22px 14px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 14 }}>
        <h3 className="font-ui" style={{ fontSize: 15, fontWeight: 600, color: C.text, margin: 0 }}>{title}</h3>
      </div>
      <div style={{ width: "100%", height }}>{children}</div>
      <div className="font-ui" style={{ fontSize: 11, color: C.textFaint, marginTop: 10 }}>{source}</div>
    </div>
  );
}

function CustomTooltip({ active, payload, label, suffixMap = {}, prefixMap = {} }) {
  if (!active || !payload || !payload.length) return null;
  return (
    <div style={{ background: "#0A1826", border: `1px solid ${C.hairlineStrong}`, borderRadius: 10, padding: "10px 14px" }}>
      <div className="font-ui" style={{ fontSize: 11, color: C.textMuted, marginBottom: 6 }}>{label}</div>
      {payload.map((p, i) => (
        <div key={i} className="font-mono" style={{ fontSize: 13, color: p.color, display: "flex", gap: 8, justifyContent: "space-between" }}>
          <span>{p.name}</span>
          <span>{prefixMap[p.dataKey] || ""}{typeof p.value === "number" ? p.value.toLocaleString("es-AR") : p.value}{suffixMap[p.dataKey] || ""}</span>
        </div>
      ))}
    </div>
  );
}

/* ============================================================
   MAIN
   ============================================================ */

                  <linearGradient id="blueFill" x1="0" y1="0" x2="0" y2="1">

                    <stop offset="100%" stopColor={C.gold} stopOpacity={0} />

                <Area type="monotone" dataKey="reservas" name="Reservas" stroke={C.green} fill="url(#resFill)" strokeWidth={2} isAnimationActive animationDuration={1000} />

          <ChartPanel title="Riesgo país (EMBI+ Argentina)" source="Fuente: JP Morgan EMBI+ vía informes de mercado." height={240}>

                <YAxis tick={{ fill: C.textFaint, fontSize: 10 }} axisLine={false} tickLine={false} width={40} unit=" pb" />
                <Tooltip content={<CustomTooltip suffixMap={{ riesgo: " pb" }} />} />
                <Line type="monotone" dataKey="riesgo" name="Riesgo país" stroke={C.coral} strokeWidth={2.5} dot={false} isAnimationActive animationDuration={1000} />
              </LineChart>
            </ResponsiveContainer>
          </ChartPanel>
        </div>

        <ChartPanel title="Desglose por rubro — incidencia en el IPC de junio 2026"
          source="Fuente: INDEC, IPC junio 2026. Recreación y cultura lideró el mes por el impacto de aumentos estacionales." height={260}>
          <ResponsiveContainer>
            <BarChart data={rubrosJun26} layout="vertical" margin={{ top: 4, right: 24, left: 8, bottom: 0 }}>
              <CartesianGrid stroke={C.hairline} horizontal={false} />
              <XAxis type="number" tick={{ fill: C.textFaint, fontSize: 10 }} axisLine={false} tickLine={false} unit="%" />
              <YAxis type="category" dataKey="rubro" tick={{ fill: C.textMuted, fontSize: 12 }} axisLine={false} tickLine={false} width={150} />
              <Tooltip content={<CustomTooltip suffixMap={{ valor: "%" }} />} />
              <Bar dataKey="valor" name="Var. % mensual" radius={[0, 6, 6, 0]} isAnimationActive animationDuration={900}>
                {rubrosJun26.map((r, i) => (
                  <Cell key={i} fill={i === 0 ? C.coral : C.steel} fillOpacity={i === 0 ? 1 : 0.55} />
                ))}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </ChartPanel>

        <footer style={{ marginTop: 40, paddingTop: 20, borderTop: `1px solid ${C.hairline}` }}>
          <p className="font-ui" style={{ fontSize: 12, color: C.textFaint, lineHeight: 1.7, maxWidth: 760 }}>
            Panel elaborado por <strong style={{ color: C.textMuted }}>Natanael Demarco</strong> — Analista de Datos &amp; BI, como pieza de portfolio.
            Serie mensual reconstruida a partir de reportes públicos de INDEC, BCRA, Ámbito, El Cronista y La Nación (ene-2025 a jul-2026)
            con fines demostrativos; los meses sin publicación oficial de IPC se muestran sin dato. Stack: React, Recharts.
          </p>
        </footer>
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PulsoEconomicoArgentino />);
</script>
</body>
</html>
